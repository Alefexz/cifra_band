<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cifra Band | Central de Suporte</title>
  <script src="./config.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090d;
      --panel: #14141d;
      --panel-2: #1b1b27;
      --line: rgba(255, 255, 255, .08);
      --text: #f7f7fb;
      --muted: #9a9aaa;
      --blue: #4285ff;
      --green: #22c55e;
      --red: #f43f5e;
      --orange: #f59e0b;
      --radius: 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(66, 133, 255, .16), transparent 34rem),
        var(--bg);
      color: var(--text);
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue), #22c55e);
      color: white;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 18px 60px rgba(66, 133, 255, .22);
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(28px, 4vw, 44px); letter-spacing: 0; }
    .subtitle { color: var(--muted); margin-top: 4px; }

    .userbar {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ghost {
      background: rgba(255, 255, 255, .06);
      color: var(--text);
      padding: 10px 13px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .primary {
      background: var(--blue);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 800;
    }

    .success { background: var(--green); color: white; }
    .danger { background: rgba(244, 63, 94, .14); color: #ff9bae; }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .015)), var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 52px rgba(0, 0, 0, .22);
    }

    .login-card {
      max-width: 440px;
      margin: 10vh auto 0;
      padding: 26px;
    }

    .login-card h2 { font-size: 28px; margin-bottom: 8px; }
    .form { display: grid; gap: 12px; margin-top: 22px; }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #101018;
      color: var(--text);
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: rgba(66, 133, 255, .8);
      box-shadow: 0 0 0 4px rgba(66, 133, 255, .12);
    }

    .toolbar {
      display: grid;
      gap: 14px;
      padding: 16px;
      position: sticky;
      top: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      padding: 14px;
      background: var(--panel-2);
      border-radius: 14px;
      border: 1px solid var(--line);
    }

    .stat strong { display: block; font-size: 28px; }
    .stat span { color: var(--muted); font-size: 12px; font-weight: 700; }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      color: var(--muted);
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--line);
      padding: 9px 12px;
      border-radius: 999px;
      font-weight: 800;
    }

    .chip.active {
      color: white;
      background: var(--blue);
      border-color: var(--blue);
    }

    .main {
      display: grid;
      gap: 14px;
    }

    .tickets-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 14px;
      padding: 4px 2px;
    }

    .tickets-header h2 { font-size: 24px; }
    .tickets-header span { color: var(--muted); font-size: 13px; }

    .ticket {
      padding: 18px;
      display: grid;
      gap: 14px;
      transition: transform .16s ease, border-color .16s ease;
    }

    .ticket:hover {
      transform: translateY(-1px);
      border-color: rgba(66, 133, 255, .35);
    }

    .ticket-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .badges { display: flex; gap: 8px; flex-wrap: wrap; }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      background: rgba(66, 133, 255, .14);
      color: #8bb4ff;
    }

    .pill.critical { background: rgba(244, 63, 94, .14); color: #ff9bae; }
    .pill.high { background: rgba(245, 158, 11, .14); color: #ffc46b; }
    .pill.resolved { background: rgba(34, 197, 94, .14); color: #79e69e; }
    .pill.closed { background: rgba(255, 255, 255, .08); color: #b8b8c5; }

    .ticket-message {
      font-size: 16px;
      line-height: 1.48;
      color: #f2f2f5;
      white-space: pre-wrap;
    }

    .meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .actions button {
      padding: 9px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .07);
      color: white;
      border: 1px solid var(--line);
      font-weight: 800;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .detail {
      padding: 12px;
      background: rgba(255, 255, 255, .04);
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .detail strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 50px 22px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 22px;
      margin-bottom: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: #202030;
      color: white;
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 14px;
      transition: .2s ease;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .35);
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden { display: none !important; }

    @media (max-width: 860px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .toolbar { position: static; }
      .details { grid-template-columns: 1fr; }
      .tickets-header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="loginView" class="card login-card">
      <div class="brand">
        <div class="logo">CB</div>
        <div>
          <h2>Central de Suporte</h2>
          <p class="subtitle">Entre com a conta admin do Cifra Band.</p>
        </div>
      </div>

      <form id="loginForm" class="form">
        <label>
          E-mail
          <input id="emailInput" type="email" autocomplete="email" required />
        </label>
        <label>
          Senha
          <input id="passwordInput" type="password" autocomplete="current-password" required />
        </label>
        <button class="primary" type="submit">Entrar no painel</button>
      </form>
    </section>

    <section id="dashboardView" class="hidden">
      <header class="topbar">
        <div class="brand">
          <div class="logo">CB</div>
          <div>
            <h1>Central de Suporte</h1>
            <p class="subtitle">Feedbacks, bugs e sugestões enviados pelo app.</p>
          </div>
        </div>
        <div class="userbar">
          <span id="userEmail">-</span>
          <button id="refreshButton" class="ghost" type="button">Atualizar</button>
          <button id="exportButton" class="ghost" type="button">Exportar CSV</button>
          <button id="logoutButton" class="ghost" type="button">Sair</button>
        </div>
      </header>

      <div class="grid">
        <aside class="card toolbar">
          <div class="stats">
            <div class="stat"><strong id="totalStat">0</strong><span>Total filtrado</span></div>
            <div class="stat"><strong id="criticalStat">0</strong><span>Críticos</span></div>
            <div class="stat"><strong id="openStat">0</strong><span>Abertos</span></div>
            <div class="stat"><strong id="resolvedStat">0</strong><span>Resolvidos</span></div>
          </div>

          <label>
            Buscar no texto
            <input id="searchInput" type="search" placeholder="Cifra, usuário, aparelho..." />
          </label>

          <div>
            <p class="subtitle" style="margin-bottom: 10px;">Status</p>
            <div class="filters" id="filters"></div>
          </div>
        </aside>

        <section class="main">
          <div class="tickets-header">
            <div>
              <h2 id="listTitle">Abertos</h2>
              <span id="listSubtitle">Carregando feedbacks...</span>
            </div>
          </div>
          <div id="ticketsList"></div>
        </section>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const config = window.CIFRA_BAND_PANEL_CONFIG || {};
    const state = {
      idToken: localStorage.getItem('cifraBandSupportToken') || '',
      email: localStorage.getItem('cifraBandSupportEmail') || '',
      status: 'open',
      tickets: [],
      filtered: []
    };

    const statusLabels = {
      open: 'Abertos',
      resolved: 'Resolvidos',
      closed: 'Fechados',
      all: 'Todos'
    };

    const typeLabels = {
      bug: 'Bug',
      wrong_chord: 'Cifra errada',
      question: 'Dúvida',
      suggestion: 'Sugestão'
    };

    const severityLabels = {
      critical: 'Crítico',
      high: 'Alto',
      medium: 'Médio',
      low: 'Baixo'
    };

    const $ = (id) => document.getElementById(id);

    function showToast(message) {
      const toast = $('toast');
      toast.textContent = message;
      toast.classList.add('show');
      window.setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function showDashboard() {
      $('loginView').classList.add('hidden');
      $('dashboardView').classList.remove('hidden');
      $('userEmail').textContent = state.email || 'Admin';
    }

    function showLogin() {
      $('dashboardView').classList.add('hidden');
      $('loginView').classList.remove('hidden');
    }

    async function login(email, password) {
      if (!config.firebaseApiKey) {
        throw new Error('config.js sem firebaseApiKey.');
      }

      const url = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(config.firebaseApiKey)}`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, returnSecureToken: true })
      });
      const body = await response.json();

      if (!response.ok) {
        throw new Error(body.error?.message || 'Login recusado pelo Firebase.');
      }

      state.idToken = body.idToken;
      state.email = body.email || email;
      localStorage.setItem('cifraBandSupportToken', state.idToken);
      localStorage.setItem('cifraBandSupportEmail', state.email);
    }

    async function api(path, options = {}) {
      const response = await fetch(`${config.apiBaseUrl}${path}`, {
        ...options,
        headers: {
          Authorization: `Bearer ${state.idToken}`,
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      const body = text ? JSON.parse(text) : {};

      if (response.status === 401) {
        logout(false);
        throw new Error('Sessão expirada. Entre novamente.');
      }

      if (!response.ok) {
        throw new Error(body.message || `API retornou HTTP ${response.status}`);
      }

      return body;
    }

    async function loadTickets() {
      $('listSubtitle').textContent = 'Carregando feedbacks...';
      $('ticketsList').innerHTML = '<div class="card empty"><strong>Carregando</strong>Aguarde um instante.</div>';

      try {
        const body = await api(`/support-tickets?status=${state.status}&limit=100`);
        state.tickets = Array.isArray(body.tickets) ? body.tickets : [];
        applySearch();
        showToast('Feedbacks atualizados.');
      } catch (error) {
        $('ticketsList').innerHTML = `<div class="card empty"><strong>Não carregou</strong>${escapeHtml(error.message)}</div>`;
        $('listSubtitle').textContent = 'Erro ao carregar.';
      }
    }

    async function setTicketStatus(ticketId, status) {
      await api(`/support-tickets/${encodeURIComponent(ticketId)}`, {
        method: 'PATCH',
        body: JSON.stringify({ status })
      });
      showToast(`Feedback marcado como ${statusLabels[status] || status}.`);
      await loadTickets();
    }

    function applySearch() {
      const term = $('searchInput').value.trim().toLowerCase();
      state.filtered = state.tickets.filter((ticket) => {
        if (!term) return true;
        return JSON.stringify(ticket).toLowerCase().includes(term);
      });
      render();
    }

    function renderFilters() {
      $('filters').innerHTML = Object.entries(statusLabels).map(([value, label]) => (
        `<button class="chip ${state.status === value ? 'active' : ''}" data-status="${value}" type="button">${label}</button>`
      )).join('');

      $('filters').querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.status = button.dataset.status;
          renderFilters();
          loadTickets();
        });
      });
    }

    function render() {
      const tickets = state.filtered;
      $('listTitle').textContent = statusLabels[state.status] || 'Feedbacks';
      $('listSubtitle').textContent = `${tickets.length} feedback(s) encontrados`;
      $('totalStat').textContent = tickets.length;
      $('criticalStat').textContent = tickets.filter(ticket => ticket.severity === 'critical').length;
      $('openStat').textContent = tickets.filter(ticket => ticket.status === 'open').length;
      $('resolvedStat').textContent = tickets.filter(ticket => ticket.status === 'resolved').length;

      if (!tickets.length) {
        $('ticketsList').innerHTML = '<div class="card empty"><strong>Nada por aqui</strong>Nenhum feedback encontrado nesse filtro.</div>';
        return;
      }

      $('ticketsList').innerHTML = tickets.map(renderTicket).join('');
      $('ticketsList').querySelectorAll('[data-action]').forEach((button) => {
        button.addEventListener('click', async () => {
          button.disabled = true;
          try {
            await setTicketStatus(button.dataset.id, button.dataset.action);
          } catch (error) {
            showToast(error.message);
            button.disabled = false;
          }
        });
      });
    }

    function renderTicket(ticket) {
      const createdAt = ticket.created_at ? new Date(ticket.created_at).toLocaleString('pt-BR') : 'Sem data';
      const user = ticket.user || {};
      const app = ticket.app || {};
      const device = ticket.device || {};
      const statusClass = ticket.status === 'resolved' ? 'resolved' : ticket.status === 'closed' ? 'closed' : '';
      const severityClass = ticket.severity === 'critical' ? 'critical' : ticket.severity === 'high' ? 'high' : '';
      const deviceLabel = [device.manufacturer, device.model, device.release ? `Android ${device.release}` : ''].filter(Boolean).join(' • ') || 'Não informado';

      return `
        <article class="card ticket">
          <div class="ticket-top">
            <div class="badges">
              <span class="pill ${severityClass}">${escapeHtml(typeLabels[ticket.type] || ticket.type || 'Feedback')}</span>
              <span class="pill ${severityClass}">${escapeHtml(severityLabels[ticket.severity] || ticket.severity || 'Médio')}</span>
              <span class="pill ${statusClass}">${escapeHtml(statusLabels[ticket.status] || ticket.status || 'Aberto')}</span>
            </div>
            <span class="subtitle">${escapeHtml(createdAt)}</span>
          </div>
          <p class="ticket-message">${escapeHtml(ticket.message || '')}</p>
          <div class="meta">
            <span>${escapeHtml(user.name || user.email || 'Usuário')}</span>
            <span>${escapeHtml(ticket.screen || 'Tela não informada')}</span>
            <span>${escapeHtml(deviceLabel)}</span>
          </div>
          <div class="details">
            <div class="detail">E-mail<strong>${escapeHtml(user.email || 'Não informado')}</strong></div>
            <div class="detail">App<strong>${escapeHtml(`${app.version || '-'}+${app.build_number || '-'}`)}</strong></div>
            <div class="detail">Ticket<strong>${escapeHtml(ticket.id || '-')}</strong></div>
          </div>
          <div class="actions">
            <button data-action="open" data-id="${escapeHtml(ticket.id)}" type="button">Reabrir</button>
            <button data-action="resolved" data-id="${escapeHtml(ticket.id)}" class="success" type="button">Resolver</button>
            <button data-action="closed" data-id="${escapeHtml(ticket.id)}" class="danger" type="button">Fechar</button>
          </div>
        </article>
      `;
    }

    function exportCsv() {
      const rows = [
        ['id', 'status', 'tipo', 'prioridade', 'usuario', 'email', 'tela', 'mensagem', 'criado_em'],
        ...state.filtered.map(ticket => [
          ticket.id,
          ticket.status,
          typeLabels[ticket.type] || ticket.type,
          severityLabels[ticket.severity] || ticket.severity,
          ticket.user?.name || '',
          ticket.user?.email || '',
          ticket.screen || '',
          ticket.message || '',
          ticket.created_at || ''
        ])
      ];
      const csv = rows.map(row => row.map(csvCell).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cifra-band-feedbacks-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function csvCell(value) {
      return `"${String(value ?? '').replaceAll('"', '""')}"`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function logout(showMessage = true) {
      state.idToken = '';
      state.email = '';
      localStorage.removeItem('cifraBandSupportToken');
      localStorage.removeItem('cifraBandSupportEmail');
      showLogin();
      if (showMessage) showToast('Você saiu do painel.');
    }

    $('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.submitter;
      button.disabled = true;
      button.textContent = 'Entrando...';
      try {
        await login($('emailInput').value, $('passwordInput').value);
        showDashboard();
        renderFilters();
        await loadTickets();
      } catch (error) {
        showToast(error.message);
      } finally {
        button.disabled = false;
        button.textContent = 'Entrar no painel';
      }
    });

    $('refreshButton').addEventListener('click', loadTickets);
    $('exportButton').addEventListener('click', exportCsv);
    $('logoutButton').addEventListener('click', () => logout());
    $('searchInput').addEventListener('input', applySearch);

    if (state.idToken) {
      showDashboard();
      renderFilters();
      loadTickets();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
