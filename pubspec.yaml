name: cifra_band
description: "A new Flutter project."

publish_to: 'none'

version: 1.3.0+15

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Banco de dados local
  sqflite: ^2.4.2+1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Estado
  flutter_riverpod: ^2.4.9

  # Internet / APIs
  http: ^1.6.0

  # Navegação
  go_router: ^17.4.0

  # Firebase e Notificações
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

  # Interface
  google_fonts: ^8.2.1

  # Utilidades
  intl: ^0.20.3
  wakelock_plus: ^1.7.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  timezone: ^0.11.1

  # ==========================================================
  # BUSCA / MÚSICA / PLAYER
  # ==========================================================
  # Player de áudio
  just_audio: ^0.10.6

  # Controle de sessão de áudio, foco, Bluetooth
  audio_session: ^0.2.4

  # Cache das capas e imagens vindas da internet
  cached_network_image: ^3.4.1

  # Extrai cores predominantes das capas
  palette_generator_plus: ^1.0.0
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.5.0
  device_info_plus: ^13.2.0
  pdf: ^3.12.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo_symbol_only.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_symbol_only.png"
  min_sdk_android: 21
